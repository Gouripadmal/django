<!DOCTYPE html>
<html>
<head>
    <title>Student List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .student {
            background-color: white;
            width: 400px;
            margin: 15px auto;
            padding: 15px;
            border-radius: 8px;
        }

        .passed {
            color: green;
            font-weight: bold;
        }

        .failed {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Classroom Students</h1>

    {% if students %}

        {% for student in students %}

            <div class="student">

                <h2>{{ student.name }}</h2>

                <p>Grade: {{ student.grade }}</p>

                {% if student.passed %}
                    <p class="passed">Passed</p>
                {% else %}
                    <p class="failed">Failed</p>
                {% endif %}

            </div>

        {% endfor %}

    {% else %}

        <h2>No students found.</h2>

    {% endif %}

</body>
</html>
