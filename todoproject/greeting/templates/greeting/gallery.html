{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>My Image Gallery</title>

    <link rel="stylesheet" href="{% static 'greeting/style.css' %}">
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="navigation">
        <a href="/gallery/">Gallery</a>
        <a href="/contact/">Contact</a>
    </div>

    <div class="gallery">

        <div class="image-card">
            <img src="{% static 'greeting/images/image1.jpg' %}" alt="Nature">
            <p>Beautiful Nature</p>
        </div>

        <div class="image-card">
            <img src="{% static 'greeting/images/image2.jpg' %}" alt="Mountain">
            <p>Beautiful Mountain</p>
        </div>

        <div class="image-card">
            <img src="{% static 'greeting/images/image3.jpg' %}" alt="Beach">
            <p>Beautiful Beach</p>
        </div>

    </div>

</body>
</html>
